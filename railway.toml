[build]
builder = "dockerfile"

[deploy]
healthcheckPath = "/setup/healthz"
healthcheckTimeout = 300
restartPolicyType = "on_failure"

# Require a persistent volume mounted at /data (Railway).
requiredMountPath = "/data"

[variables]
# NOTE: Railway injects PORT automatically.
# Do not set PORT here; Railway templates may not apply it reliably and hardcoding
# can cause domain routing mismatches.
OPENCLAW_STATE_DIR = "/data/.openclaw"
OPENCLAW_WORKSPACE_DIR = "/data/workspace"
# Optional: set to your app's public URL (e.g. https://your-app.up.railway.app) so the
# Control UI "origin not allowed" is fixed automatically. If unset, the wrapper uses
# RAILWAY_PUBLIC_DOMAIN or a Host-header fallback when available.
# OPENCLAW_PUBLIC_ORIGIN = "https://your-app.up.railway.app"
